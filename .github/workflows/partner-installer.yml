name: ALVIN Partner Installer

on:
  workflow_dispatch:
    inputs:
      partner_id:
        description: 'Partner ID, e.g. AP-1001'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-partner-installer:
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Build partner installer
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          PARTNER_ID: ${{ inputs.partner_id }}
        run: |
          $ErrorActionPreference = 'Stop'

          $safePartnerId = $env:PARTNER_ID -replace '[^A-Za-z0-9._-]', '-'

          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'User-Agent' = 'ALVIN-Partner-Builder'
          }

          $release = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/ScrewMagazine/alvin-browser/releases/latest' `
            -Headers $headers

          $installers = @(
            $release.assets | Where-Object {
              $_.name -match '^ALVIN-Browser-Setup-.+\.exe$'
            }
          )

          if ($installers.Count -ne 1) {
            throw 'Expected exactly one ALVIN Browser installer.'
          }

          $downloadUrl = $installers[0].browser_download_url
          $outputExe = "ALVIN-Partner-$safePartnerId.exe"

          $source = @"
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.Net;
          using System.Windows.Forms;

          class Program
          {
              [STAThread]
              static void Main()
              {
                  try
                  {
                      string partnerId = "$safePartnerId";
                      string url = "$downloadUrl";

                      string tempInstaller = Path.Combine(
                          Path.GetTempPath(),
                          "ALVIN-Browser-Setup.exe"
                      );

                      string partnerFile = Path.Combine(
                          Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),
                          "ALVIN",
                          "partner.txt"
                      );

                      Directory.CreateDirectory(Path.GetDirectoryName(partnerFile));
                      File.WriteAllText(partnerFile, partnerId);

                      ServicePointManager.SecurityProtocol = SecurityProtocolType.Tls12;

                      using (WebClient client = new WebClient())
                      {
                          client.Headers.Add("User-Agent", "ALVIN-Partner-Installer");
                          client.DownloadFile(url, tempInstaller);
                      }

                      Process.Start(new ProcessStartInfo
                      {
                          FileName = tempInstaller,
                          UseShellExecute = true
                      });
                  }
                  catch (Exception ex)
                  {
                      MessageBox.Show(
                          ex.Message,
                          "ALVIN Partner Installer Error"
                      );
                  }
              }
          }
          "@

          Set-Content -Path partner-installer.cs -Value $source -Encoding UTF8

          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'

          & $compiler `
            /nologo `
            /target:winexe `
            /reference:System.Windows.Forms.dll `
            /out:$outputExe `
            partner-installer.cs

          if (!(Test-Path $outputExe)) {
            throw 'Partner installer was not created.'
          }

          Write-Host "Built: $outputExe"
          Write-Host "Partner: $safePartnerId"
          Write-Host "ALVIN source release: $($release.tag_name)"

      - name: Upload partner installer
        uses: actions/upload-artifact@v4
        with:
          name: ALVIN-Partner-${{ inputs.partner_id }}
          path: ALVIN-Partner-*.exe
          if-no-files-found: error
